<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>摸鱼大作战 · 背景音乐小样</title>
<style>
  body { margin: 0; background: #F6E7D2; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; color: #3D2B1F; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { font-size: 26px; margin: 8px 0 4px; text-align: center; }
  p.sub { text-align: center; color: #8C6B4F; margin: 0 0 20px; font-size: 14px; }
  .card { background: #FFFBF3; border: 3px solid #3D2B1F; border-radius: 18px; padding: 16px 18px; margin: 14px 0; box-shadow: 0 5px 0 #3D2B1F; }
  .card h2 { font-size: 20px; margin: 0 0 4px; }
  .card .meta { color: #8C6B4F; font-size: 13px; margin-bottom: 10px; }
  .card .desc { font-size: 14px; line-height: 1.6; margin-bottom: 12px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  button { font: inherit; font-size: 16px; font-weight: 700; border: 3px solid #3D2B1F; border-radius: 14px; padding: 10px 18px; background: #FFB52E; color: #fff; box-shadow: 0 4px 0 #3D2B1F; cursor: pointer; }
  button.alt { background: #fff; color: #3D2B1F; }
  button.on { background: #E0453A; }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 #3D2B1F; }
  .bar { height: 8px; background: #EFE5D8; border-radius: 4px; margin-top: 12px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: #FFB52E; }
  .tip { font-size: 13px; color: #8C6B4F; text-align: center; margin-top: 18px; line-height: 1.6; }
</style>
</head>
<body>
<main>
  <h1>背景音乐小样</h1>
  <p class="sub">三段都是代码实时合成的，没有用任何音频文件。点「播放」试听，点「冲刺版」听最后 30 秒加速升调的效果。</p>
  <div id="list"></div>
  <p class="tip">听完告诉我选哪一段（或者想要哪两段的混合、哪里再改），我再把它接进游戏里。<br>手机静音键打开时可能没有声音。</p>
</main>
<script>
// —— 极简合成器 + 16 分音符步进音序器 ——
const AC = window.AudioContext || window.webkitAudioContext;
let ctx = null, master = null, timer = null, playing = null, step = 0, nextT = 0;
const NOTE = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
const midi = s => { const m = /^([A-G])([#b]?)(-?\d)$/.exec(s); return 12 * (+m[3] + 1) + NOTE[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0); };
const hz = n => 440 * Math.pow(2, (n - 69) / 12);
function init() {
  if (ctx) return; ctx = new AC();
  const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4; comp.connect(ctx.destination);
  master = ctx.createGain(); master.gain.value = 0.55; master.connect(comp);
}
let pulse25 = null;
function wave(type) {
  if (type !== 'pulse') return null;
  if (!pulse25) { const n = 32, re = new Float32Array(n), im = new Float32Array(n); for (let k = 1; k < n; k++) im[k] = (2 / (k * Math.PI)) * Math.sin(k * Math.PI * 0.25); pulse25 = ctx.createPeriodicWave(re, im); }
  return pulse25;
}
function note(f, t, dur, type, vol, opts) {
  opts = opts || {};
  const o = ctx.createOscillator(), g = ctx.createGain();
  const w = wave(type); if (w) o.setPeriodicWave(w); else o.type = type;
  o.frequency.setValueAtTime(f, t);
  if (opts.slide) o.frequency.exponentialRampToValueAtTime(f * opts.slide, t + dur);
  if (opts.vib) { const l = ctx.createOscillator(), lg = ctx.createGain(); l.frequency.value = 6; lg.gain.value = f * 0.012; l.connect(lg); lg.connect(o.frequency); l.start(t + 0.08); l.stop(t + dur + 0.05); }
  const a = opts.attack || 0.006, rel = opts.release || 0.05;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + a);
  g.gain.setValueAtTime(vol, t + Math.max(a, dur - rel)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  let out = g;
  if (opts.lp) { const f2 = ctx.createBiquadFilter(); f2.type = 'lowpass'; f2.frequency.value = opts.lp; f2.Q.value = opts.q || 1; g.connect(f2); out = f2; }
  o.connect(g); out.connect(master); o.start(t); o.stop(t + dur + 0.05);
}
let noiseBuf = null;
function noise(t, dur, vol, type, freq) {
  if (!noiseBuf) { const n = ctx.sampleRate; noiseBuf = ctx.createBuffer(1, n, n); const d = noiseBuf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1; }
  const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
  s.buffer = noiseBuf; f.type = type; f.frequency.value = freq; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.02);
}
const DRUM = {
  k: (t, v) => { note(150, t, 0.16, 'sine', 0.9 * v, { slide: 0.3, attack: 0.002, release: 0.1 }); },
  s: (t, v) => { noise(t, 0.14, 0.45 * v, 'bandpass', 1800); note(210, t, 0.08, 'triangle', 0.25 * v, { slide: 0.6, attack: 0.002 }); },
  h: (t, v) => noise(t, 0.035, 0.14 * v, 'highpass', 7500),
  o: (t, v) => noise(t, 0.14, 0.13 * v, 'highpass', 6500),
  c: (t, v) => noise(t, 0.8, 0.22 * v, 'highpass', 5000),
};
// 解析一小节：8 个八分音符（空格分隔）；x = 休止，- = 延长上一个音；"A5.B5" = 两个十六分音符
function bar(str) {
  const out = []; const toks = str.trim().split(/\s+/);
  toks.forEach((tk, i) => {
    if (tk === 'x') return;
    if (tk === '-') { const last = out[out.length - 1]; if (last) last.len += 2; return; }
    const parts = tk.split('.');
    parts.forEach((p, j) => out.push({ at: i * 2 + j * (2 / parts.length), n: midi(p), len: 2 / parts.length }));
  });
  return out;
}

// —— 三首小样 ——
const SONGS = [
  {
    id: 'A', name: 'A · 泡泡糖跳跳', bpm: 152, key: 'C 大调',
    desc: '最像泡泡堂：方波主旋律一蹦一跳，低音八度来回弹，鼓点轻快。整体最可爱、最有"街机感"。',
    chords: ['C', 'G', 'Am', 'F', 'C', 'G', 'F', 'G'],
    lead: { type: 'square', vol: 0.11, lp: 3800, gate: 0.7 },
    mel: [
      'E5 G5 C6 G5 E5 x G5 x', 'D5 G5 B5 G5 D5 x B4 x', 'C5 E5 A5 E5 C5 x E5 x', 'A5 - G5 F5 E5 - D5 -',
      'E5 E5 x G5 x C6 B5 A5', 'G5 - D5 - G5 A5 B5 -', 'A5 G5 F5 E5 F5 - A5 -', 'G5 - - x D6 C6 B5 G5',
    ],
    bass: 'octave', bassType: 'square', bassVol: 0.09, arp: false,
    drums: { k: [0, 6, 8], s: [4, 12], h: [0, 2, 4, 6, 8, 10, 12, 14] },
  },
  {
    id: 'B', name: 'B · 卡丁车冲刺', bpm: 162, key: 'F 大调',
    desc: '最像跑跑卡丁车：锯齿波主旋律带滑音，四拍底鼓 + 反拍开镲推着走，速度最快、最有冲劲。',
    chords: ['F', 'C', 'Dm', 'Bb', 'F', 'C', 'Bb', 'C'],
    lead: { type: 'sawtooth', vol: 0.075, lp: 2600, gate: 0.85, vib: true },
    mel: [
      'F5 x A5 x C6 x A5 C6', 'E5 x G5 x C6 - - x', 'D5 F5 A5 D6 C6 A5 F5 A5', 'Bb5 - A5 - G5 - F5 G5',
      'A5 A5 x C6 x A5 G5 F5', 'G5 - E5 - C5 E5 G5 C6', 'D6 C6 Bb5 A5 G5 - F5 G5', 'E5 - G5 - C6 - - x',
    ],
    bass: 'drive', bassType: 'sawtooth', bassVol: 0.08, arp: false,
    drums: { k: [0, 4, 8, 12], s: [4, 12], o: [2, 6, 10, 14], h: [1, 3, 5, 7, 9, 11, 13, 15] },
  },
  {
    id: 'C', name: 'C · 糖果像素', bpm: 146, key: 'G 大调',
    desc: '最"芯片音乐"：窄脉冲主旋律 + 十六分音符快速琶音，像老游戏机，热闹但不吵。',
    chords: ['G', 'Em', 'C', 'D', 'G', 'Em', 'C', 'D'],
    lead: { type: 'pulse', vol: 0.12, lp: 4200, gate: 0.6 },
    mel: [
      'G5 - B5 - D6 - B5 A5', 'G5 - E5 - B4 - E5 G5', 'A5 - G5 E5 C5 E5 G5 -', 'F#5 - A5 - D6 C6 B5 A5',
      'B5 B5 A5 G5 A5 - B5 -', 'G5 - E5 F#5 G5 - B5 -', 'C6 B5 A5 G5 E5 - G5 A5', 'B5 - A5 - G5 - - x',
    ],
    bass: 'walk', bassType: 'triangle', bassVol: 0.2, arp: true,
    drums: { k: [0, 8, 10], s: [4, 12], h: [0, 2, 4, 6, 8, 10, 12, 14] },
  },
];
const CH = { C: [48, 52, 55], G: [43, 47, 50], Am: [45, 48, 52], F: [41, 45, 48], Dm: [50, 53, 57], Bb: [46, 50, 53], Em: [40, 43, 47], D: [50, 54, 57] };
SONGS.forEach(s => (s.bars = s.mel.map(bar)));

let rush = false;
function schedule(song, i, t, s16) {
  const b = Math.floor(i / 16) % song.bars.length, st = i % 16, up = rush ? 2 : 0;
  const ch = CH[song.chords[b]].map(n => n + up), root = ch[0] - 12;
  // 鼓
  for (const k in song.drums) if (song.drums[k].includes(st)) DRUM[k](t, 1);
  if (st === 0 && b === 0) DRUM.c(t, 1);
  if (rush && st % 2 === 1) DRUM.h(t, 0.6);
  // 低音
  if (song.bass === 'octave' && st % 2 === 0) note(hz(root + (st % 4 === 2 ? 12 : 0)), t, s16 * 1.7, song.bassType, song.bassVol, { lp: 900 });
  if (song.bass === 'drive' && st % 2 === 0) note(hz(root + (st === 6 || st === 14 ? 7 : 0)), t, s16 * 1.8, song.bassType, song.bassVol, { lp: 700, q: 4 });
  if (song.bass === 'walk' && st % 4 === 0) note(hz(root + [0, 7, 12, 7][st / 4]), t, s16 * 3.6, song.bassType, song.bassVol);
  // 和弦铺底（很轻）
  if (st === 0) for (const n of ch) note(hz(n + 12), t, s16 * 15, 'triangle', 0.018, { attack: 0.05, release: 0.3 });
  // 十六分琶音
  if (song.arp) { const seq = [ch[0], ch[1], ch[2], ch[1] + 12]; note(hz(seq[st % 4] + 24), t, s16 * 0.8, 'square', 0.025, { lp: 3000 }); }
  // 主旋律
  for (const n of song.bars[b]) if (Math.abs(n.at - st) < 1e-6 || (n.at % 1 && Math.floor(n.at) === st)) {
    const dt = (n.at - st) * s16;
    note(hz(n.n + up), t + dt, Math.max(0.05, n.len * s16 * song.lead.gate), song.lead.type, song.lead.vol, { lp: song.lead.lp, vib: song.lead.vib && n.len >= 2 });
    note(hz(n.n + up), t + dt + s16 * 1.5, Math.max(0.05, n.len * s16 * song.lead.gate * 0.6), song.lead.type, song.lead.vol * 0.22, { lp: song.lead.lp * 0.6 });   // 小回声
  }
}
function start(song) {
  init(); if (ctx.state === 'suspended') ctx.resume();
  stop(); playing = song; step = 0; nextT = ctx.currentTime + 0.08;
  timer = setInterval(() => {
    const s16 = 60 / (song.bpm * (rush ? 1.2 : 1)) / 4;
    while (nextT < ctx.currentTime + 0.25) { schedule(song, step, nextT, s16); step++; nextT += s16; }
    const el = document.querySelector('#bar-' + song.id); if (el) el.style.width = ((step % (16 * song.bars.length)) / (16 * song.bars.length) * 100) + '%';
  }, 50);
  render();
}
function stop() { if (timer) clearInterval(timer); timer = null; playing = null; document.querySelectorAll('.bar i').forEach(e => (e.style.width = 0)); render(); }

function render() {
  document.getElementById('list').innerHTML = SONGS.map(s => `
    <div class="card">
      <h2>${s.name}</h2>
      <div class="meta">${s.key} · 每分钟 ${s.bpm} 拍 · 8 小节循环（约 ${Math.round(8 * 4 * 60 / s.bpm)} 秒）</div>
      <div class="desc">${s.desc}</div>
      <div class="row">
        <button class="${playing === s ? 'on' : ''}" onclick="${playing === s ? 'stop()' : `start(SONGS[${SONGS.indexOf(s)}])`}">${playing === s ? '停止' : '播放'}</button>
        <button class="alt ${rush ? 'on' : ''}" onclick="rush=!rush;render()">${rush ? '冲刺版：开' : '冲刺版：关'}</button>
      </div>
      <div class="bar"><i id="bar-${s.id}"></i></div>
    </div>`).join('');
}
render();
</script>
</body>
</html>
